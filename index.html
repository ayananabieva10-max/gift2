<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c0b">
<title>Alles Gute, Julius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0b;--fg:#efe6d6;--amber:#ffb347;--red:#e8452c;--paper:#f4ead6;--ink:#1a1512;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;--sans:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;--out:cubic-bezier(.2,.9,.25,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);user-select:none;-webkit-user-select:none;transition:background-color 1.6s ease,color 1.6s ease}
body.lit{--bg:#eadfca;--fg:var(--ink)}
body::after{content:"";position:fixed;inset:0;z-index:250;pointer-events:none;opacity:.32;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>")}
#glow{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:var(--lum,1);transition:opacity 1.2s;
  background:radial-gradient(circle 280px at var(--mx,50%) var(--my,50%),rgba(255,179,71,.13),transparent 70%),radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(0,0,0,.75))}
body.lit #glow{opacity:0}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:200;pointer-events:none}
#cur{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:300;display:none;transition:width .25s var(--out),height .25s var(--out),margin .25s var(--out)}
body.fine #cur{display:block}body.fine,body.fine *{cursor:none!important}
#cur.hot{width:58px;height:58px;margin:-29px}

/* Торт */
#cake{position:fixed;left:50%;top:50%;width:240px;height:260px;margin:-130px 0 0 -120px;z-index:5;touch-action:none;outline:none;
  transition:transform 1.4s var(--out);animation:rise 1.2s var(--out) both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
#cake.parked{transform:translate(calc(64px - 50vw),calc(50vh - 68px)) scale(.4)}
#cake svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 24px 30px rgba(0,0,0,.35))}
#halo{position:absolute;left:50%;top:9%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,170,60,.6),rgba(255,120,30,.16) 40%,transparent 68%);animation:breathe 2.4s ease-in-out infinite alternate}
@keyframes breathe{to{transform:scale(1.08)}}
#bend{transform-box:fill-box;transform-origin:50% 100%}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .17s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.93,1.07) rotate(2deg)}}
#hint{position:fixed;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom));text-align:center;z-index:6;font:500 .78rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);transition:opacity .8s}
#hint.dim{opacity:.0}
#hint.tbl{color:inherit;opacity:.5}

/* Титул */
#title{position:fixed;left:clamp(22px,6vw,90px);top:clamp(22px,7vh,80px);margin:0;z-index:1;pointer-events:none;
  font:400 clamp(3.6rem,13vw,10.5rem)/.88 var(--serif);letter-spacing:-.035em}
.ln{display:block;overflow:hidden;padding:0 .06em .1em}.ln:last-child{font-style:italic;color:var(--red)}
.ch{display:inline-block;transform:translateY(115%) rotate(6deg);opacity:0}
#title.show .ch{transform:none;opacity:1;transition:transform 1s var(--out) calc(var(--i)*55ms),opacity .5s calc(var(--i)*55ms)}

/* Фото и записка на столе */
.print{position:absolute;z-index:10;width:var(--pw);padding:8px;background:#fbf7ef;touch-action:none;cursor:grab;opacity:0;
  box-shadow:0 1px 1px rgba(0,0,0,.25),0 20px 40px -14px rgba(0,0,0,.5);
  transform:translateY(120vh) rotate(var(--r));transition:transform 1.1s var(--out),opacity .4s}
.print.in{opacity:1;transform:translateY(0) rotate(calc(var(--r) + var(--tilt,0deg)))}
.print.settled{transition:transform .3s var(--out),box-shadow .3s}
.print.held{box-shadow:0 34px 60px -16px rgba(0,0,0,.55);transform:translateY(-10px) scale(1.04) rotate(calc(var(--r) + var(--tilt,0deg)))}
.print img{display:block;width:100%;height:auto;min-height:170px;background:#d8ccb6;pointer-events:none}
.note{background:var(--paper);color:var(--ink);padding:22px;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between}
.note small{font:500 .68rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.note b{font:italic 400 2.5rem/1 var(--serif)}
.seal{align-self:flex-end;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a5c,var(--red) 55%,#9c2412);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 5px rgba(0,0,0,.08)}

/* Оверлеи */
.ov{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;background:rgba(14,12,10,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.ov.on{opacity:1;visibility:visible}
.sheet{max-height:88vh;overflow:auto;width:min(94vw,540px);padding:clamp(28px,6vw,54px);background:var(--paper);color:var(--ink);box-shadow:0 40px 90px rgba(0,0,0,.6);transform:translateY(40px) rotate(-1.5deg);transition:transform .8s var(--out)}
.ov.on .sheet{transform:none}
.sheet p{margin:0 0 1em;font:400 clamp(1.3rem,4.4vw,1.65rem)/1.35 var(--serif);opacity:0;transform:translateY(10px)}
.ov.on .sheet p{opacity:1;transform:none;transition:all .7s var(--out) calc(.25s + var(--k)*.22s)}
.sheet .sig{font-style:italic;color:var(--red);margin:1.4em 0 0}
#big{max-width:min(92vw,900px);max-height:88vh;box-shadow:0 40px 90px rgba(0,0,0,.6);transform:scale(.92);transition:transform .6s var(--out)}
#ovP.on #big{transform:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="glow"></div><canvas id="fx"></canvas><div id="cur"></div>

<h1 id="title" aria-label="Alles Gute, Julius"></h1>

<div id="cake" role="button" tabindex="0" aria-label="Kerze auspusten (gedrückt halten)">
  <div id="halo"></div>
  <svg viewBox="0 0 240 260" aria-hidden="true">
    <defs>
      <pattern id="st" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="14" height="7" fill="#efe6d6"/><rect y="7" width="14" height="7" fill="#ffb347"/></pattern>
      <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset=".6" stop-color="#ffa62e"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient>
    </defs>
    <ellipse cx="120" cy="238" rx="114" ry="14" fill="#2a231f"/><ellipse cx="120" cy="233" rx="110" ry="11" fill="#e9dfcc"/>
    <rect x="22" y="150" width="196" height="82" rx="10" fill="#5a3324"/><rect x="22" y="150" width="196" height="12" rx="6" fill="#2c1810"/><rect x="22" y="188" width="196" height="7" fill="#e8d9bb"/>
    <rect x="54" y="94" width="132" height="64" rx="9" fill="#f0e2c4"/>
    <g fill="#e8452c"><rect x="54" y="94" width="132" height="15" rx="7"/><rect x="64" y="100" width="12" height="34" rx="6"/><rect x="96" y="100" width="12" height="22" rx="6"/><rect x="128" y="100" width="12" height="38" rx="6"/><rect x="160" y="100" width="12" height="26" rx="6"/></g>
    <rect x="113" y="42" width="14" height="54" rx="3" fill="url(#st)"/><rect x="119" y="33" width="2" height="10" fill="#222"/>
    <g transform="translate(120,36)"><g id="bend"><g class="fl" id="flame">
      <path d="M0,-50 C11,-32 15,-16 0,0 C-15,-16 -11,-32 0,-50Z" fill="url(#fg)"/><path d="M0,-24 C5,-16 6,-9 0,-2 C-6,-9 -5,-16 0,-24Z" fill="#fff6d8"/>
    </g></g></g>
  </svg>
</div>
<div id="hint">Kerze gedrückt halten</div>

<div class="ov" id="ovL"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="ovP"><img id="big" alt="Foto"></div>

<script>
/* ============================ CONFIG ============================ */
const CONFIG = {
  name: 'Julius',
  from: 'Deine Ayana',
  photos: ['photo_2026-09-30_14-47-08.jpg', 'photo_2026-09-30_14-47-11.jpg', 'photo_2026-09-30_14-47-14.jpg'], // лежат рядом с index.html
  headline: 'Alles Gute,',
  letter: [
    'Julius,',
    'alles Gute zum Geburtstag.',
    'Ich wünsche dir ein Jahr mit weniger Pflichten und mehr Dingen, auf die du wirklich Lust hast. Gute Gespräche, gutes Essen und ein paar Entscheidungen, die sich später als richtig herausstellen.',
    'Ich bin froh, dass wir uns kennen.'
  ],
  ui: { blow: 'Kerze gedrückt halten', table: 'Fotos verschieben · Brief antippen', note: 'Für ' }
};

/* ============================ Utils ============================ */
const $ = s => document.querySelector(s), rand = (a, b) => a + Math.random() * (b - a), wait = ms => new Promise(r => setTimeout(r, ms));
const root = document.documentElement, cake = $('#cake'), hint = $('#hint');
hint.textContent = CONFIG.ui.blow; document.title = CONFIG.headline + ' ' + CONFIG.name;

/* Заголовок: посимвольная анимация */
(() => { let i = 0; $('#title').innerHTML = [CONFIG.headline, CONFIG.name + '.'].map(l =>
  `<span class="ln">${[...l].map(c => `<span class="ch" style="--i:${i++}">${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</span>`).join(''); })();

/* Курсор-подсветка и кастомный указатель */
const fine = matchMedia('(pointer:fine)').matches, cur = $('#cur'); let cx = innerWidth / 2, cy = innerHeight / 2, tx = cx, ty = cy;
if (fine) document.body.classList.add('fine');
addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; root.style.setProperty('--mx', tx + 'px'); root.style.setProperty('--my', ty + 'px'); });
addEventListener('pointerover', e => cur.classList.toggle('hot', !!e.target.closest('#cake,.print,.ov')));
(function follow() { cx += (tx - cx) * .22; cy += (ty - cy) * .22; cur.style.transform = `translate(${cx}px,${cy}px)`; requestAnimationFrame(follow); })();

/* ============================ Частицы ============================ */
const cv = $('#fx'), g = cv.getContext('2d'); let W, H, P = [], run = 0;
const size = () => { const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); };
addEventListener('resize', size); size();
const COL = ['#e8452c', '#ffb347', '#efe6d6', '#1a1512', '#7a8f5a'];
const add = p => { P.push(p); if (!run) { run = 1; requestAnimationFrame(step); } };
function smoke(x, y) { for (let i = 0; i < 12; i++) add({ k: 'm', x: x + rand(-4, 4), y, vx: rand(-.4, .4), vy: rand(-2, -.7), r: rand(4, 8), l: .7, d: rand(.006, .012) }); }
function confetti(n = 170, x0, y0) {
  for (let i = 0; i < n; i++) { const s = i % 2 ? 1 : -1, o = x0 != null;
    add({ k: 'c', x: o ? x0 : (s > 0 ? -10 : W + 10), y: o ? y0 : H * rand(.6, .95), vx: o ? rand(-7, 7) : s * rand(6, 15), vy: rand(-17, -6), w: rand(6, 11), h: rand(4, 7),
      a: rand(0, 6), va: rand(-.3, .3), sw: rand(0, 6), l: 1, d: rand(.004, .008), c: COL[i % COL.length] }); }
}
function step() {
  g.clearRect(0, 0, W, H);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.l -= p.d; p.x += p.vx; p.y += p.vy;
    if (p.l <= 0 || p.y > H + 30) { P.splice(i, 1); continue; }
    if (p.k === 'c') { p.vy += .3; p.vx *= .985; p.vy *= .985; p.a += p.va; p.sw += .15; g.globalAlpha = Math.min(1, p.l * 2); g.fillStyle = p.c;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.scale(1, Math.cos(p.sw)); g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
    else { p.r += .3; g.globalAlpha = p.l * .45; g.fillStyle = '#d9d0c0'; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.3); g.fill(); }
  }
  g.globalAlpha = 1; P.length ? requestAnimationFrame(step) : (run = 0, g.clearRect(0, 0, W, H));
}

/* ============================ Сцена 1: задуть свечу ============================ */
let b = 0, hold = 0, going = 0, done = 0;
const bend = $('#bend'), halo = $('#halo');
function tick() {
  b = Math.max(0, Math.min(1, b + (hold ? .017 : -.03)));
  bend.style.transform = `rotate(${b * 36}deg) scale(${1 - b * .5},${1 - b * .75})`;
  halo.style.opacity = 1 - b; root.style.setProperty('--lum', 1 - b * .7);
  if (b >= 1) return finish();
  going = (hold || b > 0) ? requestAnimationFrame(tick) : 0;
}
const press = () => { if (done) return burstCake(); hold = 1; if (!going) going = requestAnimationFrame(tick); };
const release = () => { hold = 0; };
cake.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);
cake.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
cake.addEventListener('keyup', release);
const burstCake = () => { const r = cake.getBoundingClientRect(); confetti(60, r.left + r.width / 2, r.top + 20); };

async function finish() {
  done = 1; going = 0; hint.classList.add('dim');
  const r = $('#flame').getBoundingClientRect(); bend.style.opacity = 0; halo.style.opacity = 0; smoke(r.left + r.width / 2, r.top + 10);
  await wait(500);
  document.body.classList.add('lit'); root.style.setProperty('--lum', 0);
  confetti(); await wait(700);
  cake.classList.add('parked'); $('#title').classList.add('show');
  await wait(600); table();
  hint.textContent = CONFIG.ui.table; hint.className = 'tbl'; hint.style.bottom = 'calc(3vh + env(safe-area-inset-bottom))';
}

/* ============================ Сцена 2: стол ============================ */
let z = 20;
function makePrint(inner, cls) {
  const el = document.createElement('div'); el.className = 'print ' + (cls || ''); el.innerHTML = inner; document.body.appendChild(el); return el;
}
function table() {
  const pw = Math.min(innerWidth * .5, 250), n = CONFIG.photos.length + 1, fx = [.03, .34, .64, .97], dy = [.0, .1, .02, .13];
  const items = CONFIG.photos.map((s, i) => { const el = makePrint(`<img src="${s}" alt="Foto" draggable="false">`); el.onTap = () => { $('#big').src = s; $('#ovP').classList.add('on'); }; return el; });
  const note = makePrint(`<small>${CONFIG.ui.note}${CONFIG.name}</small><b>Brief</b><i class="seal"></i>`, 'note'); note.onTap = openLetter; items.push(note);
  items.forEach((el, i) => {
    const k = innerWidth < 620 ? [.02, .22, .1, .3][i] * 1 : fx[i];
    el.style.setProperty('--pw', pw + 'px'); el.style.setProperty('--r', rand(-7, 7) + 'deg');
    el.style.left = (innerWidth < 620 ? (innerWidth - pw) * [.05, .95, .1, .9][i] : (innerWidth - pw) * fx[i]) + 'px';
    el.style.top = innerHeight * (innerWidth < 620 ? [.34, .42, .56, .62][i] : .34 + dy[i]) + 'px';
    el.style.transitionDelay = i * .18 + 's'; drag(el);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.style.transitionDelay = '0s'; el.classList.add('settled'); }, 1600 + i * 180);
  });
}
function drag(el) {
  let sx, sy, ox, oy, lx, moved;
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); sx = lx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; moved = 0; el.style.zIndex = ++z; el.classList.add('held'); });
  el.addEventListener('pointermove', e => {
    if (!el.hasPointerCapture(e.pointerId)) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 6) moved = 1;
    el.style.left = ox + dx + 'px'; el.style.top = oy + dy + 'px';
    el.style.setProperty('--tilt', Math.max(-14, Math.min(14, (e.clientX - lx) * 1.4)) + 'deg'); lx = e.clientX;
  });
  const up = () => { el.classList.remove('held'); el.style.setProperty('--tilt', '0deg'); if (!moved && el.onTap) el.onTap(); moved = 1; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', () => { el.classList.remove('held'); moved = 1; });
}

/* ============================ Письмо и просмотр ============================ */
function openLetter() {
  const L = CONFIG.letter; $('#sheet').innerHTML = L.map((t, k) => `<p style="--k:${k}">${t}</p>`).join('') + `<p class="sig" style="--k:${L.length}">${CONFIG.from}</p>`;
  $('#ovL').classList.add('on');
}
const closeAll = () => { $('#ovL').classList.remove('on'); $('#ovP').classList.remove('on'); };
$('#ovL').addEventListener('click', closeAll); $('#ovP').addEventListener('click', closeAll);
addEventListener('keydown', e => e.key === 'Escape' && closeAll());
</script>
</body>
</html>
